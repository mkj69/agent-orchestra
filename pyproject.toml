[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestra"
version = "0.2.0"
description = "A reusable skill and scripts for coordinating Codex workers"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.urls]
Homepage = "https://github.com/mkj69/agent-orchestra"
Repository = "https://github.com/mkj69/agent-orchestra"
Issues = "https://github.com/mkj69/agent-orchestra/issues"

[project.optional-dependencies]
images = ["Pillow>=9"]
dev = ["pytest>=7"]

[project.scripts]
agent-orchestra = "agent_orchestra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/agent-orchestra" = ["skills/agent-orchestra/SKILL.md"]
"share/agent-orchestra/references" = [
  "skills/agent-orchestra/references/creative-lead-brief.md",
  "skills/agent-orchestra/references/communication.md",
  "skills/agent-orchestra/references/integration.md",
  "skills/agent-orchestra/references/lessons.md",
  "skills/agent-orchestra/references/prompts.md",
  "skills/agent-orchestra/references/verification.md",
]
"share/agent-orchestra/scripts" = [
  "skills/agent-orchestra/scripts/board.sh",
  "skills/agent-orchestra/scripts/contact_sheet.py",
  "skills/agent-orchestra/scripts/dashboard.py",
  "skills/agent-orchestra/scripts/extract_prompts.py",
  "skills/agent-orchestra/scripts/kill_jobs.sh",
  "skills/agent-orchestra/scripts/launch_codex.sh",
  "skills/agent-orchestra/scripts/rebuild_with_previews.sh",
  "skills/agent-orchestra/scripts/render_requests.py",
  "skills/agent-orchestra/scripts/restart_dashboard.sh",
  "skills/agent-orchestra/scripts/route_lead.sh",
  "skills/agent-orchestra/scripts/shot.sh",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
